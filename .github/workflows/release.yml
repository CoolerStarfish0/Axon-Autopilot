name: Build and Release Axon Autopilot

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Installers
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS installers
        run: npm run dist:mac -- --x64 --arm64 --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/*.dmg
          if-no-files-found: error

  publish-windows:
    name: Publish Windows Download Immediately
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Publish Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-macos:
    name: Add macOS Downloads When Ready
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: release-assets
      - name: Publish macOS installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
